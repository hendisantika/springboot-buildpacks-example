version: 2
updates:
  # Maven dependencies (Spring Boot parent, starters, plugins)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "21:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: master
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "21:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: master
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
